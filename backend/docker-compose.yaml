# Local development database ONLY (manual checks). Tests do not use this file:
# CI runs the suite against Testcontainers (postgres:17). Never used in production.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: validexia_migrator
      # Local development ONLY. Reads FLYWAY_PASSWORD from the shell (or a
      # gitignored .env file in this directory) so the same value can be
      # handed to the app; the default is a throwaway local-only password,
      # never a production credential.
      POSTGRES_PASSWORD: ${FLYWAY_PASSWORD:-validexia-migrator-dev}
      POSTGRES_DB: validexia
      # Passed through into the container so the init script
      # (docker/init/01-roles.sh, which runs INSIDE the container) creates
      # the application role with exactly the password the application
      # itself receives on the host as DB_PASSWORD. Without this line the
      # container would only ever see the built-in default, and a custom
      # host DB_PASSWORD would silently diverge. Local development ONLY,
      # same throwaway default.
      DB_PASSWORD: ${DB_PASSWORD:-validexia-app-dev}
    ports:
      - "5432:5432"
    volumes:
      - validexia-db:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

volumes:
  validexia-db:
